[project]
name = "matilda"
version = "0.1.0"
description = "Logical rule discovery system for relational databases"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "clingo>=5.7",
    "colorama",
    "mlflow",
    "mysql-connector-python",
    "networkx",
    "numpy",
    "oracledb",
    "pandas",
    "psutil",
    "pyswip",
    "pyyaml",
    "requests",
    "scipy",
    "sqlalchemy",
    "tqdm>=4.66.1",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]

[tool.uv.sources]
pyswip = { git = "https://github.com/yuce/pyswip", rev = "master" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
